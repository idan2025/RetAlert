name: Android APK

# Builds the on-the-go Android APK with Buildozer (Kivy + python-for-android),
# run directly on the runner (no third-party Docker action). Gated: the heavy
# build only runs once a buildozer.spec exists, so this stays green (and cheap)
# until the Kivy UI lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Is there an APK to compile?
        run: |
          if [ -f buildozer.spec ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No buildozer.spec yet — nothing to compile, skipping APK build."
          fi

  apk:
    needs: detect
    if: needs.detect.outputs.buildable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer + Cython
        # Cython pinned to 0.29.x: python-for-android does not build with
        # Cython 3.x.
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer>=1.5" "cython==0.29.36"

      # Android SDK/NDK + p4a build dir are large and slow to fetch; cache them
      # across runs keyed on the spec (and reused while it is unchanged).
      - name: Cache Buildozer SDK/NDK + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: retalert-debug-apk
          path: bin/*.apk
          if-no-files-found: error
