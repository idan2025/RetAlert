name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Clone LXMF-kt composite build
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch v0.0.14 https://github.com/torlando-tech/LXMF-kt lxmf-kt
          # Upstream v0.0.14 includes :lxmf-examples unconditionally; it applies
          # the Shadow plugin 8.1.1, which is incompatible with Gradle 9 and fails
          # the composite-build configuration phase even though we only consume
          # :lxmf-core. Gate it behind an env var. Pinned tag => deterministic.
          sed -i 's/^include(":lxmf-examples")$/if (System.getenv("INCLUDE_EXAMPLES") != null) { include(":lxmf-examples") }/' lxmf-kt/settings.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-kt-${{ runner.os }}-${{ hashFiles('android/**/libs.versions.toml', 'android/**/build.gradle.kts', 'android/**/settings.gradle.kts') }}
          restore-keys: gradle-kt-${{ runner.os }}-

      # Decode the keystore (if the secret is set) and export the signing env
      # vars via GITHUB_ENV. A step output flags presence so the build/release
      # steps can branch without referencing `secrets` in an `if` conditional.
      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "RETALERT_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "RETALERT_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "RETALERT_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RETALERT_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK (signed)
        if: steps.keystore.outputs.present == 'true'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build debug APK (unsigned fallback)
        if: steps.keystore.outputs.present != 'true'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Collect APK into release-assets
        run: |
          mkdir -p release-assets
          if [ -n "$RETALERT_KEYSTORE_FILE" ]; then
            find app/build/outputs/apk/release -name '*.apk' -exec cp {} release-assets/ \;
          else
            find app/build/outputs/apk/debug -name '*.apk' -exec cp {} release-assets/ \;
          fi
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/release-assets/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}