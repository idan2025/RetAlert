name: Release

# Cuts a full GitHub Release on a version tag (vX.Y.Z). Always ships the
# Python sdist+wheel; additionally attaches the Android APK and/or the desktop
# binary, but only the targets that currently have something to compile.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          mkdir -p release-assets
          cp dist/* release-assets/

      - name: Detect buildable app targets
        id: detect
        run: |
          if [ -f buildozer.spec ]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f main.py ]; then echo "desktop=true" >> "$GITHUB_OUTPUT"; else echo "desktop=false" >> "$GITHUB_OUTPUT"; fi

      # --- Android APK (only if there's a spec to build) -----------------
      # `buildozer android release` yields an unsigned APK; add a keystore via
      # repo secrets + signing config when ready to ship signed builds.
      - name: System deps for APK build
        if: steps.detect.outputs.android == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev
      - name: Install Buildozer + Cython
        if: steps.detect.outputs.android == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer>=1.5" "cython==0.29.36"
      - name: Cache Buildozer SDK/NDK + build
        if: steps.detect.outputs.android == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-
      # Decode the signing keystore from a secret, if configured. Without it
      # the release APK is built unsigned (still a valid artifact); with it,
      # buildozer signs + zipaligns via the P4A_RELEASE_* env vars below.
      - name: Decode signing keystore
        if: steps.detect.outputs.android == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RETALERT_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::notice::Release APK will be signed."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — release APK will be UNSIGNED."
          fi
      # With a keystore -> a signed release APK. Without one, `buildozer android
      # release` still passes --sign and fails, so fall back to a debug APK
      # (unsigned but sideload-installable) so the release always ships an APK.
      - name: Build APK
        if: steps.detect.outputs.android == 'true'
        env:
          P4A_RELEASE_KEYSTORE: ${{ env.RETALERT_KEYSTORE }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${RETALERT_KEYSTORE:-}" ]; then
            yes | buildozer android release
          else
            echo "::warning::No keystore secret — attaching an unsigned DEBUG APK."
            yes | buildozer android debug
          fi
      - name: Stage APK
        if: steps.detect.outputs.android == 'true'
        run: cp bin/*.apk release-assets/

      # --- Desktop binary (only if there's a Kivy entrypoint) ------------
      - name: System deps for desktop build
        if: steps.detect.outputs.desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 libmtdev1 libgl1 xvfb
      - name: Build desktop binary
        if: steps.detect.outputs.desktop == 'true'
        env:
          KIVY_GL_BACKEND: mock
        run: |
          pip install -e ".[ui]" pyinstaller
          xvfb-run -a pyinstaller --onefile --name retalert-desktop main.py
          cp dist/retalert-desktop release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Tags with a suffix (v1.0.0-rc1, -beta) publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
