name: Desktop build

# Packages the Linux desktop app (same Kivy codebase) into a standalone
# PyInstaller binary. Gated on a Kivy entrypoint (main.py): nothing to compile
# until the UI exists, so this skips cleanly for now.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Is there a desktop app to compile?
        run: |
          if [ -f main.py ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No main.py (Kivy entrypoint) yet — nothing to compile, skipping desktop build."
          fi

  build:
    needs: detect
    if: needs.detect.outputs.buildable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # SDL/GL system libs Kivy needs at build + run time.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 libmtdev1
      - name: Install app + PyInstaller
        # `[ui]` extra (Kivy + platform UI deps) is added alongside main.py.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]"
          pip install pyinstaller
      - name: Build Linux binary
        run: pyinstaller --onefile --name retalert-desktop main.py
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: retalert-desktop-linux
          path: dist/retalert-desktop
          if-no-files-found: error
