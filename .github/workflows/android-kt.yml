name: android-kt

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-kt.yml'
  pull_request:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Clone LXMF-kt composite build
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch v0.0.14 https://github.com/torlando-tech/LXMF-kt lxmf-kt
          # Upstream v0.0.14 includes :lxmf-examples unconditionally; it applies
          # the Shadow plugin 8.1.1, which is incompatible with Gradle 9 and fails
          # the composite-build configuration phase even though we only consume
          # :lxmf-core. Gate it behind an env var. Pinned tag => deterministic.
          sed -i 's/^include(":lxmf-examples")$/if (System.getenv("INCLUDE_EXAMPLES") != null) { include(":lxmf-examples") }/' lxmf-kt/settings.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-kt-${{ runner.os }}-${{ hashFiles('android/**/libs.versions.toml', 'android/**/build.gradle.kts', 'android/**/settings.gradle.kts') }}
          restore-keys: gradle-kt-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :domain:test :data:test :reticulum:test :updater:test --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: retalert-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error