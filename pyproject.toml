[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retalert"
version = "0.1.0"
description = "Reticulum + LXMF emergency-alert app: panic button, transport-aware failover, live location tracking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "idan2025" }]
dependencies = [
    "rns>=0.9.0",
    "lxmf>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["kivy>=2.3.0", "kivy_garden.mapview>=1.0.6", "requests>=2.28", "plyer>=2.1"]

[project.scripts]
retalert = "retalert.cli:main"

[tool.setuptools.packages.find]
include = ["retalert*"]

[tool.setuptools.package-data]
retalert = ["../config/*"]