junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

# Upstream Kotlin Reticulum + LXMF (JitPack)
reticulum-kt-rns-android = { group = "com.github.torlando-tech.reticulum-kt", name = "rns-android", version.ref = "reticulumKt" }
reticulum-kt-rns-core = { group = "com.github.torlando-tech.reticulum-kt", name = "rns-core", version.ref = "reticulumKt" }
reticulum-kt-rns-interfaces = { group = "com.github.torlando-tech.reticulum-kt", name = "rns-interfaces", version.ref = "reticulumKt" }
lxmf-kt = { group = "com.github.torlando-tech.lxmf-kt", name = "lxmf-core", version.ref = "lxmfKt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
